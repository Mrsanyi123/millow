<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Millow — A little more understood, every day</title>
  <meta name="description" content="An AI companion that listens, remembers, and grows with you." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/svg+xml" href="assets/millow-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="assets/hills1.png" />
  <link rel="stylesheet" href="styles.css" />

  <script
  defer
  data-website-id="dfid_EXl1t4ngOdrgUE2xlDV8N"
  data-domain="millow.space"
  src="https://datafa.st/js/script.js">
</script>
</head>
<body class="page-home">
  <div class="frame">
    <header class="hero" id="top">
      <div class="scene" aria-hidden="true">
        <div class="layer photo"></div>
        <div class="layer haze"></div>
        <canvas class="layer pollen" id="pollen"></canvas>
      </div>

      <nav class="nav glass" aria-label="Primary">
        <a class="brand" href="/" aria-label="Millow home">
        <img class="logo" src="assets/millow-logo.svg" alt="" />
      </a>
        <ul class="nav-links">
          <li><a href="/product">Product</a></li>
          <li><a href="mailto:hello@millow.space">Contact</a></li>
        </ul>
        <a class="btn btn-light btn-sm" href="#join">Early access <span class="arrow">→</span></a>
      </nav>

      <div class="hero-inner">
        <h1 class="headline reveal" style="--d:.2s">
          A little more <em>understood</em>,<br /> every day.
        </h1>
        <p class="sub reveal" style="--d:.35s">
          An AI companion that listens, remembers, and grows with you.
        </p>
        

        <form class="waitlist glass reveal" style="--d:.55s" id="join" data-waitlist novalidate>
          <label class="sr-only" for="email">Email address</label>
          <input id="email" type="email" name="email" placeholder="Enter your email" autocomplete="email" required />
          <button class="btn btn-light" type="submit">Get Early Access <span class="arrow">→</span></button>
        </form>
        <p class="form-note reveal" style="--d:.65s" data-note>Be one of the first to meet Millow.</p>
      </div>

      <footer class="hero-foot">
        <span>© 2026 Millow</span>
        <span>Questions? <a href="mailto:hello@millow.space">hello@millow.space</a></span>
      </footer>
    </header>
  </div>

  <script src="script.js"></script>
</body>
</html>
